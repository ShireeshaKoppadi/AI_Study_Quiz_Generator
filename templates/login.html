<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AI Quiz</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="auth-container">

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Login to save your quiz history.
    </p>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

            <div class="error-message">
                {{ message }}
            </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST">

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >


        <button type="submit">

            Login

        </button>

    </form>


    <p class="auth-text">

        Don't have an account?

        <a href="/register">
            Register
        </a>

    </p>


    <a href="/"
       class="back-button">

        ← Back to Home

    </a>

</div>

</body>

</html>
